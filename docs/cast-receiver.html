<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cast Receiver — Nahom Eri TV</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
    }

    #player-wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    #player {
      width: 100%;
      height: 100%;
    }

    /* `display: flex` here outranks the UA stylesheet's `[hidden] { display:
       none }` (an ID selector beats an attribute selector), so the
       `[hidden]` rule below restates it — same fix as the install hint's
       dismiss button (see docs/style.css). */
    #receiver-message {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10vh 10vw;
      text-align: center;
      font-family: sans-serif;
      font-size: 3vw;
      color: #ddd;
      background: #0b0b0d;
    }

    #receiver-message[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <div id="player-wrap">
    <div id="player"></div>
    <div id="receiver-message" role="status" hidden></div>
  </div>

  <!-- No sw.js registration here, unlike index.html/about.html: this page
       runs in a Cast receiver context that always has live network, so
       there's no offline PWA-shell use case to precache it for. -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script type="module" src="cast-receiver.js"></script>
</body>
</html>
