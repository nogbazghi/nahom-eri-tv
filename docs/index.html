<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nahom Eri TV</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Eri TV" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Nahom Eri TV</h1>
  </header>

  <main>
    <div id="screen">
      <div id="player-wrap">
        <div id="player"></div>
        <button id="unmute" class="touch-target" type="button">🔇 Tap to unmute</button>
        <div id="corner-badge">
          <div class="badge-top">
            <span id="badge-num" class="num mono"></span>
            <span id="badge-name" class="name"></span>
          </div>
          <div id="badge-title"></div>
        </div>
      </div>

      <div id="schedule-message" class="schedule-message" role="status" hidden></div>

      <div id="guide-panel" hidden>
        <div id="guide-rows"></div>
      </div>

      <div class="toolbar">
        <span id="toolbar-chan" class="toolbar-chan"></span>
        <button id="guide-toggle" class="btn-guide touch-target" type="button" aria-expanded="false">Guide ▾</button>
      </div>
    </div>
  </main>

  <footer>
    <p>No video is downloaded or rehosted — everything plays directly from YouTube.</p>
  </footer>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="nav.js"></script>
  <script type="module" src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch((err) => {
          console.error("Service worker registration failed:", err);
        });
      });
    }
  </script>
</body>
</html>
