<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nahom Eri TV — Weddings</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Nahom Eri TV</h1>
    <p class="tagline">Eritrean and Tigrinya weddings, playing now.</p>
  </header>

  <nav id="channel-switcher"></nav>

  <main>
    <div id="player-wrap">
      <div id="player"></div>
      <button id="unmute" type="button">🔇 Tap to unmute</button>
    </div>

    <div id="credit">
      <span id="credit-title">Loading…</span>
      <span id="credit-channel"></span>
    </div>
  </main>

  <footer>
    <p>No video is downloaded or rehosted — everything plays directly from YouTube.</p>
  </footer>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js"></script>
</body>
</html>
