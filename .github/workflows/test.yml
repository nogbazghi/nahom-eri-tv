name: Test Suites

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run node test suite
        run: node --test docs/*.test.js

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Install Playwright's Chromium browser
        working-directory: docs
        run: npx playwright install --with-deps chromium

      - name: Run browser-based test suite
        run: node --test docs/browser-tests/*.test.js

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r curation/requirements.txt

      - name: Run pytest suite
        run: pytest curation/tests/
