name: Curation Pipeline

on:
  schedule:
    - cron: '0 13 * * 1' # Mondays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  STANDING_BRANCH: curation/weekly-update

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Push authenticated as an admin, not the default github-actions[bot]
          # token — required status checks on main block the bot token's
          # direct pushes unconditionally (ADR-0009's "gates PRs, not direct
          # pushes" only holds for a push the branch protection rule actually
          # lets bypass it, which the default token never can). Needed for
          # this job's same-day-takedown removal commit straight to main.
          token: ${{ secrets.ADMIN_PUSH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r curation/requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Preflight check (API key valid, quota available)
        id: preflight
        working-directory: curation
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 preflight.py

      - name: Snapshot original videos.json
        run: cp docs/data/videos.json /tmp/original-videos.json

      - name: Run curation jobs
        id: run_jobs
        working-directory: curation
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 -c "import yaml; [print(s) for s in yaml.safe_load(open('jobs.yaml'))]" | while IFS= read -r script; do
            echo "::group::Running $script"
            python3 "$script"
            echo "::endgroup::"
          done

      - name: Snapshot final state (post-run, before the removals-only rewrite below)
        run: cp docs/data/videos.json /tmp/final-videos.json

      - name: Report total estimated API usage for this run
        run: |
          python3 << 'PYEOF'
          import sys

          sys.path.insert(0, "curation")
          from pipeline import estimate_api_units, load_pending_summaries, merge_call_counts

          call_counts = merge_call_counts(*(s.get("api_calls", {}) for s in load_pending_summaries()))
          estimate = estimate_api_units(call_counts)
          print(
              f"Total estimated API usage this run (all jobs): {estimate['total_units']} unit(s) "
              f"from the shared pool, {estimate['search_calls']} search.list call(s)."
          )
          PYEOF

      - name: Compute and apply removals to main
        id: removals
        run: |
          python3 << 'PYEOF' >> "$GITHUB_OUTPUT"
          import json
          import sys

          sys.path.insert(0, "curation")
          from pipeline import load_pending_summaries

          with open("/tmp/original-videos.json") as f:
              original = json.load(f)

          removed = {}
          for summary in load_pending_summaries():
              for r in summary.get("removals", []):
                  removed[r["id"]] = r

          if removed:
              original["videos"] = [v for v in original["videos"] if v["id"] not in removed]
              with open("docs/data/videos.json", "w") as f:
                  json.dump(original, f, indent=2)
                  f.write("\n")

          print(f"count={len(removed)}")
          PYEOF

      - name: Commit removals directly to main
        if: steps.removals.outputs.count != '0'
        run: |
          git add docs/data/videos.json
          git commit -m "Remove ${{ steps.removals.outputs.count }} video(s) that failed revalidation [automated]"
          git push origin HEAD:main

      - name: Compute additions and build PR body
        id: additions
        run: |
          python3 << 'PYEOF' >> "$GITHUB_OUTPUT"
          import json
          import sys

          sys.path.insert(0, "curation")
          from pipeline import load_pending_summaries

          total = 0
          sections = []
          for summary in load_pending_summaries():
              adds = summary.get("additions", [])
              total += len(adds)
              if not adds:
                  continue
              label = summary.get("channel", "unknown").title()
              lines = [f"## {label}", f"+{len(adds)} video(s)"]
              for a in adds:
                  lines.append(f"- \"{a['title']}\" (channel: {a['channel']})")
              sections.append("\n".join(lines))

          body = "\n\n".join(sections) if sections else "No new videos this run."
          with open("/tmp/pr-body.md", "w") as f:
              f.write(body)

          print(f"count={total}")
          PYEOF

      - name: Check whether a review is already in progress
        id: review
        if: steps.additions.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --head "$STANDING_BRANCH" --base main --state open --json number > /tmp/open-prs.json
          python3 << 'PYEOF' >> "$GITHUB_OUTPUT"
          import json
          import sys

          sys.path.insert(0, "curation")
          from pipeline import has_open_review_pr

          with open("/tmp/open-prs.json") as f:
              prs = json.load(f)

          print(f"open={'true' if has_open_review_pr(prs) else 'false'}")
          PYEOF

      - name: Log skipped branch update
        if: steps.additions.outputs.count != '0' && steps.review.outputs.open == 'true'
        run: |
          echo "Skipping update to $STANDING_BRANCH: a review PR is already open. This run's additions will be re-evaluated next run."

      - name: Push additions to the standing branch
        if: steps.additions.outputs.count != '0' && steps.review.outputs.open != 'true'
        run: |
          git fetch origin main
          git checkout -B "$STANDING_BRANCH" origin/main
          cp /tmp/final-videos.json docs/data/videos.json
          git add docs/data/videos.json
          git commit -m "Weekly curation update: new videos pending review [automated]"
          git push --force origin "$STANDING_BRANCH"

      - name: Open the review PR
        if: steps.additions.outputs.count != '0' && steps.review.outputs.open != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(cat /tmp/pr-body.md)
          gh pr create \
            --head "$STANDING_BRANCH" \
            --base main \
            --title "Weekly curation update" \
            --body "$BODY" \
            --reviewer nogbazghi

      - name: Report this run's outcome to the standing health issue (#70)
        if: always()
        working-directory: curation
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          RUN_JOBS_OUTCOME: ${{ steps.run_jobs.outcome }}
        run: |
          python3 << 'PYEOF'
          import os

          from health_issue import report_run
          from pipeline import estimate_api_units, load_pending_summaries, merge_call_counts

          preflight_ok = os.environ.get("PREFLIGHT_OUTCOME") == "success"
          jobs_ok = os.environ.get("RUN_JOBS_OUTCOME") == "success"
          run_succeeded = preflight_ok and jobs_ok

          if not preflight_ok:
              detail = (
                  "Preflight check failed — the YOUTUBE_API_KEY is invalid or out "
                  "of quota, or the check hit an unrecognized error. See this "
                  "run's job log for the specific classification."
              )
          elif not jobs_ok:
              detail = "One or more curation job scripts failed. See this run's job log for details."
          else:
              call_counts = merge_call_counts(*(s.get("api_calls", {}) for s in load_pending_summaries()))
              estimate = estimate_api_units(call_counts)
              detail = (
                  f"Estimated API usage this run: {estimate['total_units']} unit(s) "
                  f"from the shared pool, {estimate['search_calls']} search.list call(s)."
              )

          report_run(title="Curation pipeline health", run_succeeded=run_succeeded, detail=detail)
          PYEOF
