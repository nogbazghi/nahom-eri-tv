# Per-channel rules for the automated curation pipeline.
#
# type: search  — discover.py runs every query in `queries` through YouTube
#                 search, restricted to recently-published results, then
#                 validates matches against the thresholds below.
# type: channel — kebire_channel.py enumerates every upload from `channel_id`
#                 (not a search), keeps only ones where `text_filter` appears
#                 in the title or description, then validates the same way.
#                 An entry may instead set `playlist_id` to enumerate that
#                 exact playlist directly (e.g. a creator's own curated
#                 playlist) instead of deriving their whole uploads history
#                 from `channel_id`.
#
# Thresholds apply uniformly to freshly-discovered candidates AND to
# previously-stored videos being re-checked on every run (see
# curation/pipeline.py's validate_record()).

weddings:
  type: search
  display_name: Weddings
  is_default: true
  queries:
    - "Tigrinya wedding"
    - "Eritrean wedding"
  view_count_min: 1000
  duration_min_sec: 120

kebire:
  type: channel
  display_name: Kebire
  channel_id: UCz9a7XA9oMmk3CpFnE456bQ
  text_filter: "eritrea"
  view_count_min: 0
  duration_min_sec: 120

news:
  type: channel
  display_name: News
  channel_id: UCpPhzhCfud9ctQSJJv4Kqlw
  playlist_id: PLjrXQ8yRJDlyLOZjQ35TMIY8DRUPPcxrh
  view_count_min: 0
  duration_min_sec: 120
