# Per-channel rules for the automated curation pipeline.
#
# type: search  — discover.py runs every query in `queries` through YouTube
#                 search, restricted to recently-published results, then
#                 validates matches against the thresholds below.
# type: channel — kebire_channel.py enumerates every upload from `channel_id`
#                 (not a search), keeps only ones where `text_filter` appears
#                 in the title or description, then validates the same way.
#                 An entry may instead set `playlist_id` to enumerate that
#                 exact playlist directly (e.g. a creator's own curated
#                 playlist) instead of deriving their whole uploads history
#                 from `channel_id`.
#
# Thresholds apply uniformly to freshly-discovered candidates AND to
# previously-stored videos being re-checked on every run (see
# curation/pipeline.py's validate_record()).

weddings:
  type: search
  display_name: Weddings
  is_default: true
  queries:
    - "Tigrinya wedding"
    - "Eritrean wedding"
  view_count_min: 1000
  duration_min_sec: 120

kebire:
  type: channel
  display_name: Kebire
  channel_id: UCz9a7XA9oMmk3CpFnE456bQ
  text_filter: "eritrea"
  view_count_min: 0
  duration_min_sec: 120

news:
  type: channel
  display_name: News
  channel_id: UCpPhzhCfud9ctQSJJv4Kqlw
  playlist_id: PLjrXQ8yRJDlyLOZjQ35TMIY8DRUPPcxrh
  view_count_min: 0
  duration_min_sec: 120

sports:
  type: channel
  display_name: Sports
  channel_id: UCpPhzhCfud9ctQSJJv4Kqlw
  playlist_id: PLjrXQ8yRJDlyS5OZoEsg0acNuCfUR3Kzp  # "Lese Sport (ለሰ ስፖርት)"
  view_count_min: 0
  duration_min_sec: 120

# Shares display_name "Sports" with the `sports` entry above (Eri-TV's own
# playlist) — the (display_name, source) scoping from ticket #16 keeps the
# two rules' runs from clobbering each other. Covers both diaspora-heritage
# players who represent other countries (Alexander Isak for Sweden, Lily
# Yohannes for the USA) and Eritrea's own national-team athletes (Biniam
# Girmay, Zersenay Tadese), per docs/research/channel-demand-signals.md §5
# and its diaspora-heritage addendum — an explicit owner decision to
# include both pools, not just Team Eritrea's own roster.
#
# Queries are plain athlete names, not "<name> Eritrea(n)"-qualified: a
# live trial run of qualified queries (e.g. "Lily Yohannes Eritrean")
# showed that once YouTube's search.list has exhausted genuinely relevant
# recent matches for a thin, specific multi-word query, it falls back to
# loosely-ranked results that merely share a word like "Eritrean" —
# surfacing a run of completely unrelated church-livestream videos in
# testing, not diaspora-player content. Plain names return real, on-topic
# candidates (confirmed in that same trial), and duration_min_sec below
# does the quality/relevance filtering that would otherwise be attempted
# by qualifying the query — it reliably drops the short hashtag-spam clips
# (e.g. "#biniamgirmay"-tagged shorts unrelated to him) that plain-name
# searches also surface, while keeping substantive match highlights,
# analysis, and news segments.
#
# "Biniam Girmay" is qualified with "cycling" (unlike Isak/Yohannes/
# Tadese) because "Girmay" alone is also a common Eritrean personal name
# unrelated to the cyclist — unqualified, live testing showed it pulling
# in unrelated diaspora content (talk shows, wedding videos, political
# commentary) that merely mentioned a different Girmay. Adding "cycling"
# was confirmed in that same testing to return only genuinely
# cycling-related candidates, consistently across repeated calls.
#
# Unlike `sports` above (a trusted single source, view_count_min: 0), this
# pulls from arbitrary YouTube search results, so it follows Weddings'
# unvetted-pool precedent with a nonzero view_count_min — set lower than
# Weddings' 1000 because this is a newer, thinner pool (Zersenay Tadese
# specifically returned zero recent results in testing) and 500 already
# comfortably excludes near-zero-view noise without excluding legitimate
# niche content.
sports_diaspora:
  type: search
  display_name: Sports
  queries:
    - "Alexander Isak"
    - "Lily Yohannes"
    - "Biniam Girmay cycling"
    - "Zersenay Tadese"
  view_count_min: 500
  duration_min_sec: 120

# Catholic sermon/teaching content, per docs/research/channel-demand-signals.md
# §8. §8 found no clean single-source Catholic teaching channel to point a
# `type: channel` rule at: supply is fragmented across several sub-20K-
# subscriber channels, organized by preacher identity rather than brand. Two
# named clergy recur across multiple of those channels — Abba Yonas Yohannes
# (AyniMay Tube, E.H, Eritrean Catholic Charismatic Renewal) and Abba
# Teclezghi Ucbaghiorghis (catholicgheez) — so this uses named-clergy search
# queries instead, the same shape as sports_diaspora.
#
# §8 also explicitly found that the generic denominational term surfaces far
# less precise results for this genre than for §1's general-Catholic-content
# case: a live trial of "Eritrean Catholic sermon" (no publishedAfter
# restriction beyond discover.py's normal 10-day window) returned 25
# results, nearly all either unrelated Orthodox-church livestream clips (a
# "#6media #orthodox" tag channel, EOTC parish channels, Amharic content with
# no connection to either named priest) or a different denomination's
# Sunday-service stream entirely — essentially zero genuine Catholic
# teaching content from either named clergy member. Named-clergy queries are
# how this genre is actually organized online, so they're the query, not a
# denominational label.
#
# "Abba Teclezghi" (unqualified) was tested live and reliably returns only
# genuine content by this priest, recurring on catholicgheez and elsewhere,
# across both a full-history trial and discover.py's normal recent-only
# window (0 noise observed; 0 results is the recent-window norm — this is a
# thin pool, same as Zersenay Tadese's precedent in sports_diaspora). Also
# including the full name "Abba Teclezghi Ucbaghiorghis" (as given in the
# research) as a second query costs nothing (dedup_candidates merges
# overlapping hits) and catches any title that spells out the surname where
# the short form might rank lower.
#
# "Abba Yonas Yohannes" unqualified was NOT kept as-is: a live trial (both in
# full-history mode and discover.py's actual 10-day recent window) showed it
# occasionally surfacing an unrelated video from a channel crediting a
# *different* "Abba Yohannes" (a hermit-monk mezmur artist, "Aba Yohannes
# Tesfamariam" — no relation), the same kind of common-partial-name collision
# sports_diaspora hit with bare "Girmay." Qualifying with "Eritrean Catholic"
# (same live trial) returned exclusively genuine on-topic results in both
# modes and dropped the collision entirely, so that's the query used here.
#
# Unlike `sports` (a trusted single source, view_count_min: 0), this pulls
# from arbitrary YouTube search results, so it follows Weddings'/
# sports_diaspora's unvetted-pool precedent with a nonzero view_count_min —
# but NOT copying sports_diaspora's 500 unchanged: this pool is thinner and
# runs lower overall (live-trial view counts for genuine sermons from these
# two priests ranged from under a thousand to ~30K, versus sports_diaspora's
# mainstream-reach diaspora athletes). 500 would risk excluding legitimate
# niche uploads observed in the 600-900 view range; the noise this round
# actually observed (the Abba Yohannes Tesfamariam collision, and a couple of
# unrelated low-production reposts) sat at well under 100 views. 300
# comfortably clears that noise floor without cutting into genuine content.
catholic:
  type: search
  display_name: Catholic
  queries:
    - "Abba Yonas Yohannes Eritrean Catholic"
    - "Abba Teclezghi"
    - "Abba Teclezghi Ucbaghiorghis"
  view_count_min: 300
  duration_min_sec: 120
