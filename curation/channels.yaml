# Per-channel rules for the automated curation pipeline.
#
# type: search  — discover.py runs every query in `queries` through YouTube
#                 search, restricted to recently-published results, then
#                 validates matches against the thresholds below.
# type: channel — kebire_channel.py enumerates every upload from `channel_id`
#                 (not a search), keeps only ones where `text_filter` appears
#                 in the title or description, then validates the same way.
#                 An entry may instead set `playlist_id` to enumerate that
#                 exact playlist directly (e.g. a creator's own curated
#                 playlist) instead of deriving their whole uploads history
#                 from `channel_id`.
#
# Thresholds apply uniformly to freshly-discovered candidates AND to
# previously-stored videos being re-checked on every run (see
# curation/pipeline.py's validate_record()).

weddings:
  type: search
  display_name: Weddings
  is_default: true
  queries:
    - "Tigrinya wedding"
    - "Eritrean wedding"
  view_count_min: 1000
  duration_min_sec: 120

kebire:
  type: channel
  display_name: Kebire
  channel_id: UCz9a7XA9oMmk3CpFnE456bQ
  text_filter: "eritrea"
  view_count_min: 0
  duration_min_sec: 120

# Kezahta (ቀዛሕታ): the one clear YouTube breakout in the Podcasters vertical
# (161K subs, 664 videos; see docs/research/channel-demand-signals.md §3).
# No playlist_id and no text_filter, same whole-catalog shape as Kebire
# above — a single trusted creator's entire uploads history, not a
# playlist-scoped slice like News/Sports.
podcasters:
  type: channel
  display_name: Podcasters
  channel_id: UCeY639opaisiHzgkLS8xZBg
  view_count_min: 0
  duration_min_sec: 120

news:
  type: channel
  display_name: News
  channel_id: UCpPhzhCfud9ctQSJJv4Kqlw
  playlist_id: PLjrXQ8yRJDlyLOZjQ35TMIY8DRUPPcxrh
  view_count_min: 0
  duration_min_sec: 120

sports:
  type: channel
  display_name: Sports
  channel_id: UCpPhzhCfud9ctQSJJv4Kqlw
  playlist_id: PLjrXQ8yRJDlyS5OZoEsg0acNuCfUR3Kzp  # "Lese Sport (ለሰ ስፖርት)"
  view_count_min: 0
  duration_min_sec: 120

# Shares display_name "Sports" with the `sports` entry above (Eri-TV's own
# playlist) — the (display_name, source) scoping from ticket #16 keeps the
# two rules' runs from clobbering each other. Covers both diaspora-heritage
# players who represent other countries (Alexander Isak for Sweden, Lily
# Yohannes for the USA) and Eritrea's own national-team athletes (Biniam
# Girmay, Zersenay Tadese), per docs/research/channel-demand-signals.md §5
# and its diaspora-heritage addendum — an explicit owner decision to
# include both pools, not just Team Eritrea's own roster.
#
# Queries are plain athlete names, not "<name> Eritrea(n)"-qualified: a
# live trial run of qualified queries (e.g. "Lily Yohannes Eritrean")
# showed that once YouTube's search.list has exhausted genuinely relevant
# recent matches for a thin, specific multi-word query, it falls back to
# loosely-ranked results that merely share a word like "Eritrean" —
# surfacing a run of completely unrelated church-livestream videos in
# testing, not diaspora-player content. Plain names return real, on-topic
# candidates (confirmed in that same trial), and duration_min_sec below
# does the quality/relevance filtering that would otherwise be attempted
# by qualifying the query — it reliably drops the short hashtag-spam clips
# (e.g. "#biniamgirmay"-tagged shorts unrelated to him) that plain-name
# searches also surface, while keeping substantive match highlights,
# analysis, and news segments.
#
# "Biniam Girmay" is qualified with "cycling" (unlike Isak/Yohannes/
# Tadese) because "Girmay" alone is also a common Eritrean personal name
# unrelated to the cyclist — unqualified, live testing showed it pulling
# in unrelated diaspora content (talk shows, wedding videos, political
# commentary) that merely mentioned a different Girmay. Adding "cycling"
# was confirmed in that same testing to return only genuinely
# cycling-related candidates, consistently across repeated calls.
#
# Unlike `sports` above (a trusted single source, view_count_min: 0), this
# pulls from arbitrary YouTube search results, so it follows Weddings'
# unvetted-pool precedent with a nonzero view_count_min — set lower than
# Weddings' 1000 because this is a newer, thinner pool (Zersenay Tadese
# specifically returned zero recent results in testing) and 500 already
# comfortably excludes near-zero-view noise without excluding legitimate
# niche content.
sports_diaspora:
  type: search
  display_name: Sports
  queries:
    - "Alexander Isak"
    - "Lily Yohannes"
    - "Biniam Girmay cycling"
    - "Zersenay Tadese"
  view_count_min: 500
  duration_min_sec: 120

# Protestant/Evangelical sermon-and-teaching channel, per
# docs/research/channel-demand-signals.md §8. Unlike Orthodox (one existing
# channel, filtered by text_filter) there is no single Protestant channel to
# point at: §8 found this content scattered across 8-10 small host-church
# channels, none owned by the preacher himself. The one real signal §8 found
# is a named traveling preacher, Pastor Goitom Gebreyonas, whose guest
# sermons draw 10K-170K views at host churches whose own typical content
# runs a few hundred to low thousands — a concentrated-demand-in-a-name
# pattern, not a concentrated-demand-in-a-channel one (structurally like
# Sports' Biniam Girmay, not like Podcasters' Kezahta). So this uses a
# type: search rule keyed to his name, same as Catholic's named-clergy
# queries, rather than generic terms like "Eritrean Protestant" or "Eritrean
# Evangelical" — §1 and §8 both confirmed those generic terms return a
# literally empty Google Trends timeline, and more importantly for this
# pipeline, live-testing confirmed the YouTube-noise problem documented in
# sports_diaspora's comment above is worse for generic terms than for a
# specific name: a genuinely distinctive multi-word name is what lets
# search.list's relevance ranking do useful work at all for a pool this
# thin.
#
# Two queries, not one: the English/Latin transliteration ("Pastor Goitom
# Gebreyonas") and the native Ge'ez-script rendering ("ፓስተር ጎይትኦም ገብረዮናስ"),
# since his host churches title videos both ways (e.g. "Sermon By Pastor
# Goitom G/Yonas" vs. "||| ሕብረት ||| ፓስተር ጎይትኦም ገብረዮናስ"). Live testing (90-day
# lookback, wider than discover.py's real 10-day window, used only to get a
# large enough sample to judge query quality) showed both queries surfacing
# the same cluster of genuine sermon hits from exactly the host channels §8
# named (Gospel Light Church Juba, Ebenezer DC, Medhanialem Church
# Gothenburg) in their first several results, then — once that genuinely
# relevant, thin supply is exhausted — falling back to loosely-ranked noise:
# other, unrelated pastors (a "pastor weldsh" at UGBC AYAT recurred across
# both queries), generic worship-song/prayer content, and in one case a
# totally unrelated meme clip with 1.9M views. This is the exact same
# exhaustion pattern sports_diaspora's comment documents for "Lily Yohannes
# Eritrean" — confirmed here against the live API rather than assumed from
# precedent.
#
# view_count_min: 300 (lower than sports_diaspora's 500 — this pool is
# thinner still; discover.py's real 10-day window typically surfaces only
# 1-2 raw candidates per run for this name, vs. sports_diaspora's handful).
# 300 was chosen, not guessed: every genuine Goitom Gebreyonas sermon found
# in testing cleared at least 1,286 views, while the directly-adjacent
# false-positive noise (the other "pastor weldsh" videos that also matched
# these queries) topped out at 179 views — 300 sits in the gap between
# those two clusters with headroom on both sides. It also incidentally
# drops two genuine-but-trivial clips (a 25-view, 4-minute excerpt and a
# 93-view, 69-second livestream announcement) that are too thin to be worth
# adding regardless of who they're about. duration_min_sec stays at the
# standard 120 used by every other entry in this file — sermon videos here
# run 30 minutes to 2 hours, so 120 only does its usual job of dropping
# sub-2-minute spam/announcement clips, the same role it plays everywhere
# else.
protestant:
  type: search
  display_name: Protestant
  queries:
    - "Pastor Goitom Gebreyonas"
    - "ፓስተር ጎይትኦም ገብረዮናስ"
  view_count_min: 300
  duration_min_sec: 120

# Anastasia ኣናስታስያ (54.4K subs, 736 videos) runs a recurring, numbered
# "ERITREAN ORTHODOX NEW SBKET [year]" sermon/teaching series by named
# clergy (principally ቀሲስ ዕርዶም ዑቅባሚካኤል, also ዲ/ን ሃብቶም ኣፈወርቂ and ቀሲስ
# ተስፋልደት ጠዓመ), per docs/research/channel-demand-signals.md §8 — but the
# same channel's dominant content by view-share is children's-choir
# mezmur (individual hymns reaching 2M+ views), so a plain channel entry
# without a filter would pull in a majority-music feed, not a teaching
# one.
#
# "sbket" was verified empirically against all 736 real uploads before
# committing to it, matching Kebire's existing title-OR-description
# behavior first: that matched 247 videos, but a manual read showed ~129
# of them were mezmur, podcast episodes, even an unrelated restaurant
# video — all pulled in because this channel pastes the SAME giant
# cross-genre hashtag block (containing both "#mezmur" and "#sbket"
# together) onto most of its uploads' descriptions regardless of genre,
# making description-text a useless relevance signal here. Restricting
# the match to the TITLE only gives a clean 114 matches with zero
# false positives on manual review — every one credits a named clergy
# member and carries the literal "ERITREAN ORTHODOX NEW SBKET" banner.
# `text_filter_title_only: true` (kebire_channel.py's
# matches_text_filter_title_only, test-first per ticket #28) opts this
# entry out of Kebire's description-matching path for exactly that
# reason. The tradeoff (a handful of older uploads whose title doesn't
# literally say "sbket" but whose description does) is accepted in
# favor of zero mezmur pollution, which is the acceptance criterion
# that actually matters for this channel.
orthodox:
  type: channel
  display_name: Orthodox
  channel_id: UCWSR_EcVezgodKqeYvwylyg
  text_filter: "sbket"
  text_filter_title_only: true
  view_count_min: 0
  duration_min_sec: 120

# Eri-TV's general, already-curated Eritrean Music catalog. Per
# docs/research/channel-demand-signals.md §2 and ADR-0003/ADR-0005, this is
# a general catalog, not decade-segmented — the original "per-decade
# nostalgia" framing was explicitly dropped in favor of reusing Eri-TV's
# existing curation outright.
#
# Eri-TV's two smaller "Eritrean Tigre Music" and "Pre-Independence Music"
# playlists were considered as additional type: channel entries sharing
# display_name "Music" (same (display_name, source) scoping as
# Sports/sports_diaspora), per issue #26. They were deliberately left out:
# a live playlists.list/playlistItems check at implementation time (2026-
# 11-03) found they are NOT the non-overlapping pools the research doc
# assumed — 29/30 of "Eritrean Tigre Music" and 4/22 of "Pre-Independence
# Music" are duplicate videos already in this main playlist, which would
# have put the same songs into the Music channel's rotation twice. If
# that changes (Eri-TV reorganizes the playlists) this can be revisited.
music:
  type: channel
  display_name: Music
  channel_id: UCpPhzhCfud9ctQSJJv4Kqlw
  playlist_id: PLjrXQ8yRJDlwKR_fhpgNNJYAq1WWz0l7f  # "Eritrean Music"
  view_count_min: 0
  duration_min_sec: 120

# 2010s/2020s Eritrean music, per issue #45 (five themed Music channels) and
# its Implementation Decisions for `music_modern`. This is NOT the
# "per-decade nostalgia" framing the `music` entry's comment above says was
# dropped — that earlier framing covered literal decade-by-decade channels
# back through the 1960s, and #45 confirmed generic decade search only
# differentiates eras cleanly from ~2010 onward (pre-2010 decade queries all
# collapse into the same undifferentiated pool — see #45's Out of Scope).
# 2010s/2020s is the one decade band where plain decade search was verified
# genuinely era-matched, high-volume, and actively-produced, distinct from
# the Liberation Era/Post-Independence Classics channels (#47/#48), which
# cover the earlier decades with phrase/named-artist queries instead because
# generic decade search doesn't work for them.
#
# Unlike `music` above (Eri-TV's own trusted, already-curated playlist,
# view_count_min: 0), this pulls from arbitrary YouTube search results, so
# it follows Weddings' unvetted-pool precedent with view_count_min: 1000.
# #45 verified this decade band isn't thin at the query-differentiation level
# (see above), but unlike sports_diaspora/catholic/fenkil_diaspora, no
# dedicated live-trial view-count range was captured for this specific
# threshold during design — 1000 is #45's suggested value (mirroring
# Weddings) taken as-is, not independently re-verified here. Per #45's
# Testing Decisions, the first live discover.py run's additions-PR review is
# where that gets confirmed or adjusted, same as every other channel.
#
# This is its own standalone row (display_name "Music · Modern"), not
# merged into any other entry's row — see ADR-0007 for why the five Music
# theme channels each get an independent row instead of the Sports/Fenkil/
# Martyrs Day/Independence Day shared-display_name pattern.
music_modern:
  type: search
  display_name: "Music · Modern"
  queries:
    - "New Eritrean music"
    - "Eritrean music 2020s"
    - "Eritrean music 2010s"
  view_count_min: 1000
  duration_min_sec: 120

fenkil:
  type: channel
  display_name: Fenkil
  channel_id: UCpPhzhCfud9ctQSJJv4Kqlw
  playlist_id: PLjrXQ8yRJDlxrxnmmg2k9vTNAtFq-N8rA  # "Fenkil (ፈንቅል)" — the big,
  # deduplicated playlist (confirmed live, 2026-11-03: 206 playlistItems
  # covering 181 unique video IDs). Deliberately NOT one of the two
  # smaller playlists on this same topic ("Fenkil Documentary 2025",
  # "ስርሒት ፈንቅል / Operation Fenkil") — both were confirmed (2026-11-03) to
  # be 100% duplicate subsets of this one, so adding them separately would
  # only create duplicate entries, not new coverage.
  #
  # This single playlist legitimately covers two different kinds of
  # content under one umbrella term, per docs/research/channel-demand-
  # signals.md §6: Eri-TV's own long-running numbered dramatized-
  # documentary series re-telling the 1990 Massawa campaign ("ፈንቅል -
  # ክፋል N", still actively airing new parts), AND Eri-TV's own annual
  # Feb 10 anniversary commemoration specials. Per the owner's brief
  # (ticket #25) these are not split into separate entries — both are in
  # scope, which is also why this channel is evergreen rather than
  # narrowly seasonal despite the name's holiday association.
  view_count_min: 0
  duration_min_sec: 120

# Shares display_name "Fenkil" with the `fenkil` entry above (Eri-TV's own
# playlist) — the (display_name, source) scoping from ticket #16 keeps the
# two rules' runs from clobbering each other (verified in both run
# orders — see ticket #25).
#
# Covers diaspora-made Fenkil-anniversary content: community/embassy
# celebration recaps and anniversary-festival coverage, distinct from
# Eri-TV's own commemoration specials and ongoing documentary series
# (covered by the `fenkil` entry above). Per docs/research/channel-
# demand-signals.md §6, "Fenkil" alone is the one term in this entire
# research project with a clean, Eritrea-specific Google Trends geo
# signal (ER=100, every other country incl. Ethiopia = 0) that also spikes
# reliably on the same Feb 10 calendar week every year tested.
#
# Queries are "Fenkil anniversary" and "Fenkil celebration", not the bare
# term "Fenkil" — a live trial run (2026-11-03) of the bare term returned
# a lot of off-topic noise for this rule's purpose (a daily Tigrinya-news
# commentary channel incidentally named "Fenql eri media", generic
# politics/military clips, and Eri-TV's own documentary episodes, which
# are already covered by the `fenkil` entry above). Qualifying with
# "anniversary" or "celebration" reliably surfaced genuine diaspora-made
# content instead: Cinema Semere Media's "36th Fenkil Anniversary
# Festival", Eritrean Unity Worldwide EPLF1's Washington DC commemoration,
# Barka Eri's Massawa coverage, Teame Tesfamariam's and YPFDJToronto's
# city-specific diaspora recaps, SEBRET Entertainment's tribute content —
# matching the diaspora-channel supply documented in §6's YouTube table.
#
# Unlike `fenkil` above (a trusted single source, view_count_min: 0), this
# pulls from arbitrary YouTube search results, so it follows Weddings' and
# sports_diaspora's unvetted-pool precedent with a nonzero view_count_min.
# Set to the same 500 as sports_diaspora (not Weddings' 1000): a live
# trial run of both queries' top results (2026-11-03) showed legitimate
# diaspora content spanning roughly 1,000-60,000 views, with only one
# outlier single-community recap below 500 — 500 comfortably excludes
# near-zero-view noise without excluding the legitimate smaller-community
# uploads that make up most of this pool.
fenkil_diaspora:
  type: search
  display_name: Fenkil
  queries:
    - "Fenkil anniversary"
    - "Fenkil celebration"
  view_count_min: 500
  duration_min_sec: 120

# Martyrs Day (June 20) — dual-source, same pattern as Sports/sports_diaspora.
# `martyrs_day` below is Eri-TV's own commemoration coverage (the official
# "Martyr's Day" playlist); `martyrs_day_diaspora` just below it is diaspora
# tribute/recap content the state broadcaster doesn't produce. Per
# docs/research/channel-demand-signals.md §6.
martyrs_day:
  type: channel
  display_name: Martyrs Day
  channel_id: UCpPhzhCfud9ctQSJJv4Kqlw
  playlist_id: PLjrXQ8yRJDlxgpLlXTxkFUmju-LC2EIHm  # "Martyr's Day (መዓልቲ ሰማእታት)" — 102 items, re-verified live at implementation time (99 at research time; growth expected, not a different playlist)
  view_count_min: 0
  duration_min_sec: 120

# Shares display_name "Martyrs Day" with the `martyrs_day` entry above — the
# (display_name, source) scoping keeps the two rules' runs from clobbering
# each other, same as Sports/sports_diaspora.
#
# §6's YouTube survey surfaces two genuinely distinct pools under this
# subject: diaspora tribute-song releases (Kosta Entertainment's annual
# "ERITREAN MARTYRS DAY" uploads, HabeshaMusic, Awet Okbay) and single-city
# community recap clips (Teame Tesfamariam's London recap, Savana Millygo's
# Toronto recap, plus one-off community uploads from Stockholm/Atlanta/
# Birmingham). Both queries below were run live against search.list (with a
# wide publishedAfter window, to judge wording quality independent of the
# production script's 10-day recency window) and each surfaced several
# genuinely on-topic, correctly-attributed results the other didn't catch
# within YouTube's per-query result cap — same justification Sports' two
# plain-name queries had for not collapsing into one.
#
# Ge'ez-script phrasing ("ሰማዕታት ኤርትራ") was deliberately not added as a
# third query: §6 flags it as noisier than the English-qualified terms,
# surfacing some unrelated Amharic/Ethiopian Orthodox devotional content
# alongside genuine matches — the same English-phrasing-beats-script-
# phrasing pattern this project has seen for every other vertical.
#
# Unlike `martyrs_day` above (a trusted single source, view_count_min: 0),
# this pulls from arbitrary YouTube search results, so it follows Weddings'/
# sports_diaspora's unvetted-pool precedent with a nonzero view_count_min.
# Live testing showed a clear quality floor around the low hundreds of
# views (a handful of single-digit-to-low-hundred-view personal clips sit
# well below everything else returned) without excluding legitimate
# small-community recap content (the Toronto/London/Stockholm recaps above
# all comfortably clear it) — 500 was chosen to match sports_diaspora's
# already-proven threshold for the same "thin, unvetted diaspora pool"
# shape, rather than inventing a new number without a comparably strong
# reason to diverge.
#
# NOTE: because June 20 is a calendar-specific commemoration (unlike
# Sports' continuously-newsworthy athletes), a live run of this rule
# outside the Martyrs Day season will likely surface few or zero new
# candidates in the production script's 10-day recency window — the
# pipeline's search mechanism is designed to catch *new* uploads since the
# last run, not to backfill the whole historical corpus, so this channel's
# diaspora pool is expected to fill in gradually, concentrated around each
# June 20 anniversary.
martyrs_day_diaspora:
  type: search
  display_name: Martyrs Day
  queries:
    - "Eritrean Martyrs Day"
    - "Martyrs Day Eritrea"
  view_count_min: 500
  duration_min_sec: 120

independence_day:
  type: channel
  display_name: Independence Day
  channel_id: UCpPhzhCfud9ctQSJJv4Kqlw
  playlist_id: PLjrXQ8yRJDlwzezrznsesIbyBnMv_6WWB  # Eri-TV's own "Independence Day" playlist
  view_count_min: 0
  duration_min_sec: 120

# Shares display_name "Independence Day" with the `independence_day` entry
# above (Eri-TV's own playlist) — the (display_name, source) scoping from
# ticket #16 keeps the two rules' runs from clobbering each other, same
# pattern as Sports/sports_diaspora. Covers diaspora community celebration
# content Eri-TV doesn't produce itself: city-by-city recaps and embassy
# events, per docs/research/channel-demand-signals.md §6 (the only vertical
# in that research showing clean, recurring annual seasonality tied to the
# actual May 24 calendar date, every year tested).
#
# Query wording was iterated against the live search.list API before
# settling on these two. The research doc's own tested terms —
# "Eritrean Independence Day" and "Independence Day Eritrea" — both do
# surface genuine diaspora content, but a live trial run of each showed
# they also pull in several videos from Eri-TV's own official channel
# (e.g. a "Military Parade" upload also confirmed, by direct playlist
# lookup, to already be inside the `independence_day` entry's own
# playlist above) — exactly the kind of same-video-under-two-sources
# duplication this dual-rule pattern is supposed to avoid, not something
# `(display_name, source)` scoping protects against, since the two rules
# add distinct pool entries for the same underlying video ID.
#
# Adding "embassy" and "community celebration" qualifiers, confirmed in
# that same live trial, reliably steers search.list toward diaspora
# organizer/community-videographer uploads (Eritrean Unity Worldwide
# EPLF1's Washington DC embassy coverage; individual community recaps
# from Seattle, Oakland, Minnesota, Dallas, Winnipeg, Cincinnati,
# Kristiansand, Melbourne, Dubai, Cairo) while returning zero results
# from Eri-TV's own official channel across a 25-result page for either
# query — unlike the unqualified terms above.
independence_day_diaspora:
  type: search
  display_name: Independence Day
  queries:
    - "Eritrean Independence Day embassy"
    - "Eritrean Independence Day community celebration"
  view_count_min: 500
  duration_min_sec: 120

# Catholic sermon/teaching content, per docs/research/channel-demand-signals.md
# §8. §8 found no clean single-source Catholic teaching channel to point a
# `type: channel` rule at: supply is fragmented across several sub-20K-
# subscriber channels, organized by preacher identity rather than brand. Two
# named clergy recur across multiple of those channels — Abba Yonas Yohannes
# (AyniMay Tube, E.H, Eritrean Catholic Charismatic Renewal) and Abba
# Teclezghi Ucbaghiorghis (catholicgheez) — so this uses named-clergy search
# queries instead, the same shape as sports_diaspora.
#
# §8 also explicitly found that the generic denominational term surfaces far
# less precise results for this genre than for §1's general-Catholic-content
# case: a live trial of "Eritrean Catholic sermon" (no publishedAfter
# restriction beyond discover.py's normal 10-day window) returned 25
# results, nearly all either unrelated Orthodox-church livestream clips (a
# "#6media #orthodox" tag channel, EOTC parish channels, Amharic content with
# no connection to either named priest) or a different denomination's
# Sunday-service stream entirely — essentially zero genuine Catholic
# teaching content from either named clergy member. Named-clergy queries are
# how this genre is actually organized online, so they're the query, not a
# denominational label.
#
# "Abba Teclezghi" (unqualified) was tested live and reliably returns only
# genuine content by this priest, recurring on catholicgheez and elsewhere,
# across both a full-history trial and discover.py's normal recent-only
# window (0 noise observed; 0 results is the recent-window norm — this is a
# thin pool, same as Zersenay Tadese's precedent in sports_diaspora). Also
# including the full name "Abba Teclezghi Ucbaghiorghis" (as given in the
# research) as a second query costs nothing (dedup_candidates merges
# overlapping hits) and catches any title that spells out the surname where
# the short form might rank lower.
#
# "Abba Yonas Yohannes" unqualified was NOT kept as-is: a live trial (both in
# full-history mode and discover.py's actual 10-day recent window) showed it
# occasionally surfacing an unrelated video from a channel crediting a
# *different* "Abba Yohannes" (a hermit-monk mezmur artist, "Aba Yohannes
# Tesfamariam" — no relation), the same kind of common-partial-name collision
# sports_diaspora hit with bare "Girmay." Qualifying with "Eritrean Catholic"
# (same live trial) returned exclusively genuine on-topic results in both
# modes and dropped the collision entirely, so that's the query used here.
#
# Unlike `sports` (a trusted single source, view_count_min: 0), this pulls
# from arbitrary YouTube search results, so it follows Weddings'/
# sports_diaspora's unvetted-pool precedent with a nonzero view_count_min —
# but NOT copying sports_diaspora's 500 unchanged: this pool is thinner and
# runs lower overall (live-trial view counts for genuine sermons from these
# two priests ranged from under a thousand to ~30K, versus sports_diaspora's
# mainstream-reach diaspora athletes). 500 would risk excluding legitimate
# niche uploads observed in the 600-900 view range; the noise this round
# actually observed (the Abba Yohannes Tesfamariam collision, and a couple of
# unrelated low-production reposts) sat at well under 100 views. 300
# comfortably clears that noise floor without cutting into genuine content.
catholic:
  type: search
  display_name: Catholic
  queries:
    - "Abba Yonas Yohannes Eritrean Catholic"
    - "Abba Teclezghi"
    - "Abba Teclezghi Ucbaghiorghis"
  view_count_min: 300
  duration_min_sec: 120
  duration_min_sec: 120

# Eritrean-heritage musicians performing outside the Tigrinya-language/
# homeland scope (English/Swedish/German/Dutch-language hip-hop, R&B,
# Afro-house, etc.), per ticket #45's Implementation Decisions and
# docs/research/eritrean-diaspora-artists-by-decade.md. Distinct from
# `music` above (Eri-TV's own curated Tigrinya-language catalog) — this is
# a type: search rule over named artists, the same shape as
# sports_diaspora/catholic, not a trusted single source.
#
# Queries are the named artists from the research doc, not generic terms
# like "Eritrean diaspora music" — consistent with this project's
# established finding (sports_diaspora, protestant, catholic) that a
# distinctive name lets search.list's relevance ranking do useful work,
# while generic terms either return thin/empty results or degrade into
# unrelated noise once a thin pool is exhausted.
#
# Per ticket #45's Out of Scope note, this query list was NOT individually
# spot-checked against live YouTube search during design (unlike
# Liberation Era and Post-Independence Classics) — this ticket's live
# trial run is where query quality and noise actually get caught, so some
# of these names may need pruning/qualifying after the first real run
# (see the PR for what that run found).
#
# view_count_min: 1000 (matching Weddings, not sports_diaspora's/
# catholic's lower thresholds) because several of these names are
# internationally famous (Nipsey Hussle, Aminé) or common enough to
# collide with unrelated same-name people/channels — a healthy view floor
# is the cheapest way to keep results to each artist's own
# official/substantive content rather than a namesake's.
music_diaspora_artists:
  type: search
  display_name: Music · Diaspora Artists
  queries:
    - "Nipsey Hussle"
    - "Aminé"
    - "Denz"
    - "Rubi Rose"
    - "AWATE"
    - "Khadija"
    - "Raheaven"
    - "RIMON"
    - "Lay Bankz"
    - "Kibra"
    - "Deno"
    - "Nura"
    - "Feven"
    - "Adiam"
    - "J. Holiday"
    - "Afrob"
  view_count_min: 1000
  duration_min_sec: 120
