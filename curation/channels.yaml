# Per-channel rules for the automated curation pipeline.
#
# type: search  — discover.py runs every query in `queries` through YouTube
#                 search, restricted to recently-published results, then
#                 validates matches against the thresholds below.
# type: channel — kebire_channel.py enumerates every upload from `channel_id`
#                 (not a search), keeps only ones where `text_filter` appears
#                 in the title or description, then validates the same way.
#                 An entry may instead set `playlist_id` to enumerate that
#                 exact playlist directly (e.g. a creator's own curated
#                 playlist) instead of deriving their whole uploads history
#                 from `channel_id`.
#
# Thresholds apply uniformly to freshly-discovered candidates AND to
# previously-stored videos being re-checked on every run (see
# curation/pipeline.py's validate_record()).

weddings:
  type: search
  display_name: Weddings
  is_default: true
  queries:
    - "Tigrinya wedding"
    - "Eritrean wedding"
  view_count_min: 1000
  duration_min_sec: 120

kebire:
  type: channel
  display_name: Kebire
  channel_id: UCz9a7XA9oMmk3CpFnE456bQ
  text_filter: "eritrea"
  view_count_min: 0
  duration_min_sec: 120

# Kezahta (ቀዛሕታ): the one clear YouTube breakout in the Podcasters vertical
# (161K subs, 664 videos; see docs/research/channel-demand-signals.md §3).
# No playlist_id and no text_filter, same whole-catalog shape as Kebire
# above — a single trusted creator's entire uploads history, not a
# playlist-scoped slice like News/Sports.
podcasters:
  type: channel
  display_name: Podcasters
  channel_id: UCeY639opaisiHzgkLS8xZBg
  view_count_min: 0
  duration_min_sec: 120

news:
  type: channel
  display_name: News
  channel_id: UCpPhzhCfud9ctQSJJv4Kqlw
  playlist_id: PLjrXQ8yRJDlyLOZjQ35TMIY8DRUPPcxrh
  view_count_min: 0
  duration_min_sec: 120

sports:
  type: channel
  display_name: Sports
  channel_id: UCpPhzhCfud9ctQSJJv4Kqlw
  playlist_id: PLjrXQ8yRJDlyS5OZoEsg0acNuCfUR3Kzp  # "Lese Sport (ለሰ ስፖርት)"
  view_count_min: 0
  duration_min_sec: 120

# Shares display_name "Sports" with the `sports` entry above (Eri-TV's own
# playlist) — the (display_name, source) scoping from ticket #16 keeps the
# two rules' runs from clobbering each other. Covers both diaspora-heritage
# players who represent other countries (Alexander Isak for Sweden, Lily
# Yohannes for the USA) and Eritrea's own national-team athletes (Biniam
# Girmay, Zersenay Tadese), per docs/research/channel-demand-signals.md §5
# and its diaspora-heritage addendum — an explicit owner decision to
# include both pools, not just Team Eritrea's own roster.
#
# Queries are plain athlete names, not "<name> Eritrea(n)"-qualified: a
# live trial run of qualified queries (e.g. "Lily Yohannes Eritrean")
# showed that once YouTube's search.list has exhausted genuinely relevant
# recent matches for a thin, specific multi-word query, it falls back to
# loosely-ranked results that merely share a word like "Eritrean" —
# surfacing a run of completely unrelated church-livestream videos in
# testing, not diaspora-player content. Plain names return real, on-topic
# candidates (confirmed in that same trial), and duration_min_sec below
# does the quality/relevance filtering that would otherwise be attempted
# by qualifying the query — it reliably drops the short hashtag-spam clips
# (e.g. "#biniamgirmay"-tagged shorts unrelated to him) that plain-name
# searches also surface, while keeping substantive match highlights,
# analysis, and news segments.
#
# "Biniam Girmay" is qualified with "cycling" (unlike Isak/Yohannes/
# Tadese) because "Girmay" alone is also a common Eritrean personal name
# unrelated to the cyclist — unqualified, live testing showed it pulling
# in unrelated diaspora content (talk shows, wedding videos, political
# commentary) that merely mentioned a different Girmay. Adding "cycling"
# was confirmed in that same testing to return only genuinely
# cycling-related candidates, consistently across repeated calls.
#
# Unlike `sports` above (a trusted single source, view_count_min: 0), this
# pulls from arbitrary YouTube search results, so it follows Weddings'
# unvetted-pool precedent with a nonzero view_count_min — set lower than
# Weddings' 1000 because this is a newer, thinner pool (Zersenay Tadese
# specifically returned zero recent results in testing) and 500 already
# comfortably excludes near-zero-view noise without excluding legitimate
# niche content.
sports_diaspora:
  type: search
  display_name: Sports
  queries:
    - "Alexander Isak"
    - "Lily Yohannes"
    - "Biniam Girmay cycling"
    - "Zersenay Tadese"
  view_count_min: 500
  duration_min_sec: 120

# Anastasia ኣናስታስያ (54.4K subs, 736 videos) runs a recurring, numbered
# "ERITREAN ORTHODOX NEW SBKET [year]" sermon/teaching series by named
# clergy (principally ቀሲስ ዕርዶም ዑቅባሚካኤል, also ዲ/ን ሃብቶም ኣፈወርቂ and ቀሲስ
# ተስፋልደት ጠዓመ), per docs/research/channel-demand-signals.md §8 — but the
# same channel's dominant content by view-share is children's-choir
# mezmur (individual hymns reaching 2M+ views), so a plain channel entry
# without a filter would pull in a majority-music feed, not a teaching
# one.
#
# "sbket" was verified empirically against all 736 real uploads before
# committing to it, matching Kebire's existing title-OR-description
# behavior first: that matched 247 videos, but a manual read showed ~129
# of them were mezmur, podcast episodes, even an unrelated restaurant
# video — all pulled in because this channel pastes the SAME giant
# cross-genre hashtag block (containing both "#mezmur" and "#sbket"
# together) onto most of its uploads' descriptions regardless of genre,
# making description-text a useless relevance signal here. Restricting
# the match to the TITLE only gives a clean 114 matches with zero
# false positives on manual review — every one credits a named clergy
# member and carries the literal "ERITREAN ORTHODOX NEW SBKET" banner.
# `text_filter_title_only: true` (kebire_channel.py's
# matches_text_filter_title_only, test-first per ticket #28) opts this
# entry out of Kebire's description-matching path for exactly that
# reason. The tradeoff (a handful of older uploads whose title doesn't
# literally say "sbket" but whose description does) is accepted in
# favor of zero mezmur pollution, which is the acceptance criterion
# that actually matters for this channel.
orthodox:
  type: channel
  display_name: Orthodox
  channel_id: UCWSR_EcVezgodKqeYvwylyg
  text_filter: "sbket"
  text_filter_title_only: true
  view_count_min: 0
  duration_min_sec: 120

# Eri-TV's general, already-curated Eritrean Music catalog. Per
# docs/research/channel-demand-signals.md §2 and ADR-0003/ADR-0005, this is
# a general catalog, not decade-segmented — the original "per-decade
# nostalgia" framing was explicitly dropped in favor of reusing Eri-TV's
# existing curation outright.
#
# Eri-TV's two smaller "Eritrean Tigre Music" and "Pre-Independence Music"
# playlists were considered as additional type: channel entries sharing
# display_name "Music" (same (display_name, source) scoping as
# Sports/sports_diaspora), per issue #26. They were deliberately left out:
# a live playlists.list/playlistItems check at implementation time (2026-
# 11-03) found they are NOT the non-overlapping pools the research doc
# assumed — 29/30 of "Eritrean Tigre Music" and 4/22 of "Pre-Independence
# Music" are duplicate videos already in this main playlist, which would
# have put the same songs into the Music channel's rotation twice. If
# that changes (Eri-TV reorganizes the playlists) this can be revisited.
music:
  type: channel
  display_name: Music
  channel_id: UCpPhzhCfud9ctQSJJv4Kqlw
  playlist_id: PLjrXQ8yRJDlwKR_fhpgNNJYAq1WWz0l7f  # "Eritrean Music"
  view_count_min: 0
  duration_min_sec: 120

fenkil:
  type: channel
  display_name: Fenkil
  channel_id: UCpPhzhCfud9ctQSJJv4Kqlw
  playlist_id: PLjrXQ8yRJDlxrxnmmg2k9vTNAtFq-N8rA  # "Fenkil (ፈንቅል)" — the big,
  # deduplicated playlist (confirmed live, 2026-11-03: 206 playlistItems
  # covering 181 unique video IDs). Deliberately NOT one of the two
  # smaller playlists on this same topic ("Fenkil Documentary 2025",
  # "ስርሒት ፈንቅል / Operation Fenkil") — both were confirmed (2026-11-03) to
  # be 100% duplicate subsets of this one, so adding them separately would
  # only create duplicate entries, not new coverage.
  #
  # This single playlist legitimately covers two different kinds of
  # content under one umbrella term, per docs/research/channel-demand-
  # signals.md §6: Eri-TV's own long-running numbered dramatized-
  # documentary series re-telling the 1990 Massawa campaign ("ፈንቅል -
  # ክፋል N", still actively airing new parts), AND Eri-TV's own annual
  # Feb 10 anniversary commemoration specials. Per the owner's brief
  # (ticket #25) these are not split into separate entries — both are in
  # scope, which is also why this channel is evergreen rather than
  # narrowly seasonal despite the name's holiday association.
  view_count_min: 0
  duration_min_sec: 120

# Shares display_name "Fenkil" with the `fenkil` entry above (Eri-TV's own
# playlist) — the (display_name, source) scoping from ticket #16 keeps the
# two rules' runs from clobbering each other (verified in both run
# orders — see ticket #25).
#
# Covers diaspora-made Fenkil-anniversary content: community/embassy
# celebration recaps and anniversary-festival coverage, distinct from
# Eri-TV's own commemoration specials and ongoing documentary series
# (covered by the `fenkil` entry above). Per docs/research/channel-
# demand-signals.md §6, "Fenkil" alone is the one term in this entire
# research project with a clean, Eritrea-specific Google Trends geo
# signal (ER=100, every other country incl. Ethiopia = 0) that also spikes
# reliably on the same Feb 10 calendar week every year tested.
#
# Queries are "Fenkil anniversary" and "Fenkil celebration", not the bare
# term "Fenkil" — a live trial run (2026-11-03) of the bare term returned
# a lot of off-topic noise for this rule's purpose (a daily Tigrinya-news
# commentary channel incidentally named "Fenql eri media", generic
# politics/military clips, and Eri-TV's own documentary episodes, which
# are already covered by the `fenkil` entry above). Qualifying with
# "anniversary" or "celebration" reliably surfaced genuine diaspora-made
# content instead: Cinema Semere Media's "36th Fenkil Anniversary
# Festival", Eritrean Unity Worldwide EPLF1's Washington DC commemoration,
# Barka Eri's Massawa coverage, Teame Tesfamariam's and YPFDJToronto's
# city-specific diaspora recaps, SEBRET Entertainment's tribute content —
# matching the diaspora-channel supply documented in §6's YouTube table.
#
# Unlike `fenkil` above (a trusted single source, view_count_min: 0), this
# pulls from arbitrary YouTube search results, so it follows Weddings' and
# sports_diaspora's unvetted-pool precedent with a nonzero view_count_min.
# Set to the same 500 as sports_diaspora (not Weddings' 1000): a live
# trial run of both queries' top results (2026-11-03) showed legitimate
# diaspora content spanning roughly 1,000-60,000 views, with only one
# outlier single-community recap below 500 — 500 comfortably excludes
# near-zero-view noise without excluding the legitimate smaller-community
# uploads that make up most of this pool.
fenkil_diaspora:
  type: search
  display_name: Fenkil
  queries:
    - "Fenkil anniversary"
    - "Fenkil celebration"
  view_count_min: 500
  duration_min_sec: 120

# Martyrs Day (June 20) — dual-source, same pattern as Sports/sports_diaspora.
# `martyrs_day` below is Eri-TV's own commemoration coverage (the official
# "Martyr's Day" playlist); `martyrs_day_diaspora` just below it is diaspora
# tribute/recap content the state broadcaster doesn't produce. Per
# docs/research/channel-demand-signals.md §6.
martyrs_day:
  type: channel
  display_name: Martyrs Day
  channel_id: UCpPhzhCfud9ctQSJJv4Kqlw
  playlist_id: PLjrXQ8yRJDlxgpLlXTxkFUmju-LC2EIHm  # "Martyr's Day (መዓልቲ ሰማእታት)" — 102 items, re-verified live at implementation time (99 at research time; growth expected, not a different playlist)
  view_count_min: 0
  duration_min_sec: 120

# Shares display_name "Martyrs Day" with the `martyrs_day` entry above — the
# (display_name, source) scoping keeps the two rules' runs from clobbering
# each other, same as Sports/sports_diaspora.
#
# §6's YouTube survey surfaces two genuinely distinct pools under this
# subject: diaspora tribute-song releases (Kosta Entertainment's annual
# "ERITREAN MARTYRS DAY" uploads, HabeshaMusic, Awet Okbay) and single-city
# community recap clips (Teame Tesfamariam's London recap, Savana Millygo's
# Toronto recap, plus one-off community uploads from Stockholm/Atlanta/
# Birmingham). Both queries below were run live against search.list (with a
# wide publishedAfter window, to judge wording quality independent of the
# production script's 10-day recency window) and each surfaced several
# genuinely on-topic, correctly-attributed results the other didn't catch
# within YouTube's per-query result cap — same justification Sports' two
# plain-name queries had for not collapsing into one.
#
# Ge'ez-script phrasing ("ሰማዕታት ኤርትራ") was deliberately not added as a
# third query: §6 flags it as noisier than the English-qualified terms,
# surfacing some unrelated Amharic/Ethiopian Orthodox devotional content
# alongside genuine matches — the same English-phrasing-beats-script-
# phrasing pattern this project has seen for every other vertical.
#
# Unlike `martyrs_day` above (a trusted single source, view_count_min: 0),
# this pulls from arbitrary YouTube search results, so it follows Weddings'/
# sports_diaspora's unvetted-pool precedent with a nonzero view_count_min.
# Live testing showed a clear quality floor around the low hundreds of
# views (a handful of single-digit-to-low-hundred-view personal clips sit
# well below everything else returned) without excluding legitimate
# small-community recap content (the Toronto/London/Stockholm recaps above
# all comfortably clear it) — 500 was chosen to match sports_diaspora's
# already-proven threshold for the same "thin, unvetted diaspora pool"
# shape, rather than inventing a new number without a comparably strong
# reason to diverge.
#
# NOTE: because June 20 is a calendar-specific commemoration (unlike
# Sports' continuously-newsworthy athletes), a live run of this rule
# outside the Martyrs Day season will likely surface few or zero new
# candidates in the production script's 10-day recency window — the
# pipeline's search mechanism is designed to catch *new* uploads since the
# last run, not to backfill the whole historical corpus, so this channel's
# diaspora pool is expected to fill in gradually, concentrated around each
# June 20 anniversary.
martyrs_day_diaspora:
  type: search
  display_name: Martyrs Day
  queries:
    - "Eritrean Martyrs Day"
    - "Martyrs Day Eritrea"
  view_count_min: 500
  duration_min_sec: 120
