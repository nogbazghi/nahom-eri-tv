# 1991-2000s Eritrean music, curated by named artist rather than a generic
# decade search, per issue #45's Implementation Decisions and ticket #48.
# docs/research/channel-demand-signals.md §2 originally floated a "music per
# decade" channel, but a live trial of generic decade-qualified queries (e.g.
# "Eritrean music 1990s") was verified not to differentiate eras before
# roughly 2010 — YouTube's own upload/era tagging for this catalog is too
# noisy, so a decade search just returns the same undifferentiated "old
# music" pool regardless of which decade is asked for. Naming actual artists
# sidesteps that: each query is scoped to a real post-independence-era
# musician instead of a decade label.
#
# Queries are the eight named 1990s/2000s artists from issue #45's
# Implementation Decisions (itself sourced from
# docs/research/tigrinya-eritrean-artists-by-decade.md's 1990s/2000s tables)
# — Abraham Afewerki, Abeba Haile, Helen Meles, Elsa Kidane and Fitsum
# Zemichael (1990s), plus Dawit Shilan, Senait Mehari and Asmara All Stars
# (2000s). Two names present in those same research-doc tables are NOT in
# issue #45's query list and are left out here too:
# - Tsighe Teklesenbet — the doc only documents her as a Shushan Band member
#   with no solo discography or dated milestone of her own, too thin for a
#   standalone search query.
# - Dehab Faytinga — NOT excluded for being a pre-independence artist (the
#   doc actually frames her 2000s entry as her *better*-documented decade:
#   a 2003 album, a 2000 Ma'Africa prize, and 2005/2010 Expo performances,
#   versus her 1970s liberation-struggle-era debut). She's left off issue
#   #45's list regardless, and is already indirectly covered here via the
#   "Asmara All Stars" query, since the doc lists her as a member of that
#   ensemble.
#
# Thresholds follow sports_diaspora's/catholic's unvetted-search-pool
# precedent rather than Kebire/Music's trusted-single-source
# view_count_min: 0: this pulls from arbitrary YouTube search results across
# eight different named-artist queries, so it needs a quality floor the same
# way those other named-query channels do. view_count_min: 500 and
# duration_min_sec: 120 are the thresholds given in issue #45's
# Implementation Decisions directly, matching sports_diaspora's/fenkil_
# diaspora's/martyrs_day_diaspora's/independence_day_diaspora's 500 rather
# than catholic's/protestant's lower 300 — these are more broadly-known
# recording artists (several with Wikipedia pages and international releases)
# than the thin, sermon-specific pools those two channels serve.
music_post_independence_classics:
  type: search
  display_name: Music · Post-Independence Classics
  queries:
    - "Abraham Afewerki"
    - "Abeba Haile"
    - "Helen Meles"
    - "Elsa Kidane"
    - "Fitsum Zemichael"
    - "Dawit Shilan"
    - "Senait Mehari"
    - "Asmara All Stars"
  view_count_min: 500
  duration_min_sec: 120

# Eritrean-heritage musicians performing outside the Tigrinya-language/
# homeland scope (English/Swedish/German/Dutch-language hip-hop, R&B,
# Afro-house, etc.), per ticket #45's Implementation Decisions and
# docs/research/eritrean-diaspora-artists-by-decade.md. Distinct from
# `music` above (Eri-TV's own curated Tigrinya-language catalog) — this is
# a type: search rule over named artists, the same shape as
# sports_diaspora/catholic, not a trusted single source.
#
# Queries are the named artists from the research doc, not generic terms
# like "Eritrean diaspora music" — consistent with this project's
# established finding (sports_diaspora, protestant, catholic) that a
# distinctive name lets search.list's relevance ranking do useful work,
# while generic terms either return thin/empty results or degrade into
# unrelated noise once a thin pool is exhausted.
#
# Per ticket #45's Out of Scope note, this query list was NOT individually
# spot-checked against live YouTube search during design (unlike
# Liberation Era and Post-Independence Classics) — this ticket's live
# trial run is where query quality and noise actually got caught, and it
# caught a lot: of the original 16 bare-name queries, only "Nipsey Hussle"
# and "Rubi Rose" are distinctive enough on their own to return clean,
# genuinely on-topic hits. Every other query that returned anything was
# dominated by namesake/common-word collisions, well past
# view_count_min's ability to filter them out (the colliding content is
# often itself popular) — "Aminé" surfaced a wave of unrelated
# Francophone/Arabic "Amine" creators, "AWATE" surfaced a Marathi
# finance-exam-prep channel's host surname, "Khadija" surfaced the common
# Muslim first name across lifestyle/religious/political content (plus
# footballer Khadija Shaw), "Nura" surfaced a Linux OS, a different Hausa
# singer, and a river name, "Deno" surfaced an unrelated podcast/DJ and
# the Deno JS runtime, and "J. Holiday" surfaced generic
# "holiday"-themed content. Each of those (plus "Denz", "RIMON", "Feven",
# "Adiam") was re-queried qualified with a genre/role term or the
# artist's fuller name from
# docs/research/eritrean-diaspora-artists-by-decade.md, the same fix
# pattern as `sports_diaspora`'s "Biniam Girmay cycling" and `catholic`'s
# full-name queries. "Lay Bankz", "Afrob", and "Raheaven" returned zero
# candidates in this run's 10-day recency window — thin pools, same
# accepted pattern as Zersenay Tadese in sports_diaspora and Catholic's
# named clergy. "Kibra" was also tightened to her full name pre-emptively,
# since the one hit it returned unqualified was an ambiguous,
# unverifiable namesake match, not confirmed on-topic content.
#
# view_count_min: 1000 (matching Weddings, not sports_diaspora's/
# catholic's lower thresholds) because several of these names are
# internationally famous (Nipsey Hussle, Aminé) or common enough to
# collide with unrelated same-name people/channels — a healthy view floor
# helps, but query qualification above is what actually does the real
# relevance filtering here, per the collision examples above.
music_diaspora_artists:
  type: search
  display_name: Music · Diaspora Artists
  queries:
    - "Nipsey Hussle"
    - "Aminé rapper"
    - "Denz rapper Sweden"
    - "Rubi Rose"
    - "AWATE rapper"
    - "Khadija Afro house DJ"
    - "Raheaven"
    - "RIMON singer"
    - "Lay Bankz"
    - "Kibra Tesfaye"
    - "Deno UK singer"
    - "Nura rapper"
    - "Feven Ghebremicael"
    - "Adiam Dymott"
    - "J Holiday singer"
    - "Afrob"
  view_count_min: 1000
  duration_min_sec: 120
