# Per-channel rules for the automated curation pipeline.
#
# type: search  — discover.py runs every query in `queries` through YouTube
#                 search, restricted to recently-published results, then
#                 validates matches against the thresholds below.
# type: channel — kebire_channel.py enumerates every upload from `channel_id`
#                 (not a search), keeps only ones where `text_filter` appears
#                 in the title or description, then validates the same way.
#                 An entry may instead set `playlist_id` to enumerate that
#                 exact playlist directly (e.g. a creator's own curated
#                 playlist) instead of deriving their whole uploads history
#                 from `channel_id`.
#
# Thresholds apply uniformly to freshly-discovered candidates AND to
# previously-stored videos being re-checked on every run (see
# curation/pipeline.py's validate_record()).

weddings:
  type: search
  display_name: Weddings
  is_default: true
  queries:
    - "Tigrinya wedding"
    - "Eritrean wedding"
  view_count_min: 1000
  duration_min_sec: 120

kebire:
  type: channel
  display_name: Kebire
  channel_id: UCz9a7XA9oMmk3CpFnE456bQ
  text_filter: "eritrea"
  view_count_min: 0
  duration_min_sec: 120

news:
  type: channel
  display_name: News
  channel_id: UCpPhzhCfud9ctQSJJv4Kqlw
  playlist_id: PLjrXQ8yRJDlyLOZjQ35TMIY8DRUPPcxrh
  view_count_min: 0
  duration_min_sec: 120

sports:
  type: channel
  display_name: Sports
  channel_id: UCpPhzhCfud9ctQSJJv4Kqlw
  playlist_id: PLjrXQ8yRJDlyS5OZoEsg0acNuCfUR3Kzp  # "Lese Sport (ለሰ ስፖርት)"
  view_count_min: 0
  duration_min_sec: 120

# Shares display_name "Sports" with the `sports` entry above (Eri-TV's own
# playlist) — the (display_name, source) scoping from ticket #16 keeps the
# two rules' runs from clobbering each other. Covers both diaspora-heritage
# players who represent other countries (Alexander Isak for Sweden, Lily
# Yohannes for the USA) and Eritrea's own national-team athletes (Biniam
# Girmay, Zersenay Tadese), per docs/research/channel-demand-signals.md §5
# and its diaspora-heritage addendum — an explicit owner decision to
# include both pools, not just Team Eritrea's own roster.
#
# Queries are plain athlete names, not "<name> Eritrea(n)"-qualified: a
# live trial run of qualified queries (e.g. "Lily Yohannes Eritrean")
# showed that once YouTube's search.list has exhausted genuinely relevant
# recent matches for a thin, specific multi-word query, it falls back to
# loosely-ranked results that merely share a word like "Eritrean" —
# surfacing a run of completely unrelated church-livestream videos in
# testing, not diaspora-player content. Plain names return real, on-topic
# candidates (confirmed in that same trial), and duration_min_sec below
# does the quality/relevance filtering that would otherwise be attempted
# by qualifying the query — it reliably drops the short hashtag-spam clips
# (e.g. "#biniamgirmay"-tagged shorts unrelated to him) that plain-name
# searches also surface, while keeping substantive match highlights,
# analysis, and news segments.
#
# "Biniam Girmay" is qualified with "cycling" (unlike Isak/Yohannes/
# Tadese) because "Girmay" alone is also a common Eritrean personal name
# unrelated to the cyclist — unqualified, live testing showed it pulling
# in unrelated diaspora content (talk shows, wedding videos, political
# commentary) that merely mentioned a different Girmay. Adding "cycling"
# was confirmed in that same testing to return only genuinely
# cycling-related candidates, consistently across repeated calls.
#
# Unlike `sports` above (a trusted single source, view_count_min: 0), this
# pulls from arbitrary YouTube search results, so it follows Weddings'
# unvetted-pool precedent with a nonzero view_count_min — set lower than
# Weddings' 1000 because this is a newer, thinner pool (Zersenay Tadese
# specifically returned zero recent results in testing) and 500 already
# comfortably excludes near-zero-view noise without excluding legitimate
# niche content.
sports_diaspora:
  type: search
  display_name: Sports
  queries:
    - "Alexander Isak"
    - "Lily Yohannes"
    - "Biniam Girmay cycling"
    - "Zersenay Tadese"
  view_count_min: 500
  duration_min_sec: 120

# Protestant/Evangelical sermon-and-teaching channel, per
# docs/research/channel-demand-signals.md §8. Unlike Orthodox (one existing
# channel, filtered by text_filter) there is no single Protestant channel to
# point at: §8 found this content scattered across 8-10 small host-church
# channels, none owned by the preacher himself. The one real signal §8 found
# is a named traveling preacher, Pastor Goitom Gebreyonas, whose guest
# sermons draw 10K-170K views at host churches whose own typical content
# runs a few hundred to low thousands — a concentrated-demand-in-a-name
# pattern, not a concentrated-demand-in-a-channel one (structurally like
# Sports' Biniam Girmay, not like Podcasters' Kezahta). So this uses a
# type: search rule keyed to his name, same as Catholic's named-clergy
# queries, rather than generic terms like "Eritrean Protestant" or "Eritrean
# Evangelical" — §1 and §8 both confirmed those generic terms return a
# literally empty Google Trends timeline, and more importantly for this
# pipeline, live-testing confirmed the YouTube-noise problem documented in
# sports_diaspora's comment above is worse for generic terms than for a
# specific name: a genuinely distinctive multi-word name is what lets
# search.list's relevance ranking do useful work at all for a pool this
# thin.
#
# Two queries, not one: the English/Latin transliteration ("Pastor Goitom
# Gebreyonas") and the native Ge'ez-script rendering ("ፓስተር ጎይትኦም ገብረዮናስ"),
# since his host churches title videos both ways (e.g. "Sermon By Pastor
# Goitom G/Yonas" vs. "||| ሕብረት ||| ፓስተር ጎይትኦም ገብረዮናስ"). Live testing (90-day
# lookback, wider than discover.py's real 10-day window, used only to get a
# large enough sample to judge query quality) showed both queries surfacing
# the same cluster of genuine sermon hits from exactly the host channels §8
# named (Gospel Light Church Juba, Ebenezer DC, Medhanialem Church
# Gothenburg) in their first several results, then — once that genuinely
# relevant, thin supply is exhausted — falling back to loosely-ranked noise:
# other, unrelated pastors (a "pastor weldsh" at UGBC AYAT recurred across
# both queries), generic worship-song/prayer content, and in one case a
# totally unrelated meme clip with 1.9M views. This is the exact same
# exhaustion pattern sports_diaspora's comment documents for "Lily Yohannes
# Eritrean" — confirmed here against the live API rather than assumed from
# precedent.
#
# view_count_min: 300 (lower than sports_diaspora's 500 — this pool is
# thinner still; discover.py's real 10-day window typically surfaces only
# 1-2 raw candidates per run for this name, vs. sports_diaspora's handful).
# 300 was chosen, not guessed: every genuine Goitom Gebreyonas sermon found
# in testing cleared at least 1,286 views, while the directly-adjacent
# false-positive noise (the other "pastor weldsh" videos that also matched
# these queries) topped out at 179 views — 300 sits in the gap between
# those two clusters with headroom on both sides. It also incidentally
# drops two genuine-but-trivial clips (a 25-view, 4-minute excerpt and a
# 93-view, 69-second livestream announcement) that are too thin to be worth
# adding regardless of who they're about. duration_min_sec stays at the
# standard 120 used by every other entry in this file — sermon videos here
# run 30 minutes to 2 hours, so 120 only does its usual job of dropping
# sub-2-minute spam/announcement clips, the same role it plays everywhere
# else.
protestant:
  type: search
  display_name: Protestant
  queries:
    - "Pastor Goitom Gebreyonas"
    - "ፓስተር ጎይትኦም ገብረዮናስ"
  view_count_min: 300
  duration_min_sec: 120
